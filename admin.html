<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход администратора</title>
<link rel="stylesheet" href="styles.css">
<style>
.admin-page {
  max-width: 420px;
  margin: 40px auto;
  padding: 0 16px 80px;
}
.admin-card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 24px 22px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.admin-card h1 {
  font-size: 1.35rem;
  margin: 0 0 8px;
}
.admin-card .hint {
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 20px;
  line-height: 1.45;
}
.admin-card label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
}
.admin-card input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  margin-bottom: 14px;
  box-sizing: border-box;
}
.admin-card input:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}
.admin-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 8px;
}
.admin-error {
  color: #b91c1c;
  font-size: 14px;
  margin-bottom: 12px;
  display: none;
}
.admin-ok {
  color: #047857;
  font-size: 14px;
  margin-bottom: 12px;
}
</style>
</head>
<body>
<main class="admin-page">
  <div style="margin-bottom:16px">
    <a href="index.html" class="home-logo" title="На главную"><img src="oge.jpg" alt="ЕГЭ/ОГЭ"></a>
  </div>
  <div class="admin-card">
    <h1>Вход администратора</h1>
    <div id="adminStatus"></div>
    <div id="loginForm">
      <div id="loginError" class="admin-error"></div>
      <label for="login">Email или логин</label>
      <input type="text" id="login" autocomplete="username" required placeholder="admin@example.com">
      <label for="password">Пароль</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="admin-actions">
        <button type="button" class="btn-bank" id="btnLogin">Войти</button>
        <a href="index.html" class="btn-bank" style="background:#6b7280">На главную</a>
      </div>
    </div>
    <div id="loggedIn" style="display:none">
      <p class="admin-ok">Вы вошли как администратор.</p>
      <div class="admin-actions">
        <a href="bank.html" class="btn-bank" id="goBank">Банк заданий</a>
        <button type="button" class="btn-bank" id="btnLogout" style="background:#b91c1c">Выйти</button>
      </div>
    </div>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || 'bank.html';

  function showLoggedIn() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('loggedIn').style.display = 'block';
    document.getElementById('goBank').href = next.indexOf('add.html') >= 0 || next.indexOf('bank') >= 0 ? next : 'bank.html';
  }
  function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('loggedIn').style.display = 'none';
  }

  if (BankAuth.isAdmin()) showLoggedIn();
  else showLogin();

  async function doLogin() {
    const err = document.getElementById('loginError');
    err.style.display = 'none';
    const login = document.getElementById('login').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Вход…';
    try {
      if (typeof initFirebase === 'function') initFirebase();
      const res = await BankAuth.loginAdmin(login, password);
      if (res.ok) {
        location.href = next;
        return;
      }
      err.textContent = res.error || 'Ошибка входа';
      err.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  }

  document.getElementById('btnLogin').onclick = doLogin;
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('login').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
  document.getElementById('btnLogout').onclick = () => {
    BankAuth.logoutAdmin();
    showLogin();
  };
})();
</script>
</body>
</html>
