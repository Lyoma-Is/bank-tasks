<style>
@import url('https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Mono&family=Marck+Script&display=swap');

#app, #app *{ box-sizing:border-box; }
#app{
  --paper:#F7F6EE;
  --rule:#D9E4EF;
  --margin:#C0392B;
  --ink:#22314A;
  --ink-soft:#5B6B85;
  --green:#3F7D4B;
  --yellow:#F5D565;
  --white:#FFFFFF;
  --shadow: 0 3px 14px rgba(34,49,74,0.10);
  font-family:'PT Sans', sans-serif;
  color:var(--ink);
  background:var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent, transparent 31px, var(--rule) 32px);
  min-height:100vh;
  padding:36px 28px 90px 100px;
  position:relative;
  line-height:1.5;
}
#app::before{
  content:"";
  position:absolute;
  top:0; bottom:0; left:68px;
  width:2px;
  background:var(--margin);
  opacity:0.5;
}
@media (max-width:680px){
  #app{padding:26px 16px 90px 22px;}
  #app::before{display:none;}
}
#app h1,#app h2,#app h3{font-family:'PT Sans',sans-serif; font-weight:700; margin:0 0 6px; color:var(--ink);}
#app .brand{font-family:'Marck Script', cursive; color:var(--margin); font-size:2.5rem; line-height:1; margin:0 0 2px; display:flex; align-items:center; gap:10px;}
#app .topbar{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:34px;}
#app .subtitle{color:var(--ink-soft); font-size:0.98rem; margin-top:2px;}
#app a{color:inherit;}

#app button{
  font-family:'PT Sans',sans-serif; font-weight:700; font-size:0.95rem;
  border-radius:8px; border:2px solid var(--ink); background:var(--white); color:var(--ink);
  padding:10px 18px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
}
#app button:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
#app button:active{ transform:translateY(0); }
#app button.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
#app button.danger{ border-color:var(--margin); color:var(--margin); }
#app button.ghost{ border-color:transparent; box-shadow:none; padding:8px 10px; }
#app button.ghost:hover{ box-shadow:none; text-decoration:underline; }
#app button:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
#app button.small{ padding:6px 12px; font-size:0.85rem; }
#app button.tiny{ padding:2px 8px; font-size:0.78rem; border-radius:6px; }

#app input[type=text], #app input[type=email], #app input[type=password], #app textarea, #app select{
  font-family:'PT Sans',sans-serif; font-size:0.98rem; color:var(--ink);
  border:none; border-bottom:2px solid var(--rule); background:transparent;
  padding:8px 4px; width:100%; outline:none; transition:border-color .15s;
}
#app input[type=text]:focus, #app input[type=email]:focus, #app input[type=password]:focus, #app textarea:focus, #app select:focus{ border-bottom-color:var(--margin); }
#app textarea{ resize:vertical; min-height:70px; line-height:1.5; }
#app label.field, #app .field{ display:block; margin-bottom:18px; }
#app label.field .lbl, #app .field .lbl{ display:block; font-size:0.82rem; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
#app .pass-wrap{ position:relative; }
#app .pass-wrap input{ padding-right:40px; }
#app .pass-toggle{
  position:absolute; right:2px; top:50%; transform:translateY(-50%);
  border:none; background:transparent; cursor:pointer; padding:4px 8px;
  color:var(--ink-soft); font-size:1.1rem; line-height:1;
  border-radius:4px;
}
#app .pass-toggle:hover{ color:var(--ink); background:transparent; box-shadow:none; transform:translateY(-50%); }

#app .card{
  background:var(--white); border-radius:3px; box-shadow:var(--shadow);
  padding:22px 24px; margin-bottom:20px; position:relative;
  border-top:3px dashed var(--rule);
}
#app .card.tilt-a{ transform:rotate(-0.35deg); }
#app .card.tilt-b{ transform:rotate(0.3deg); }

#app .numcircle{
  font-family:'Marck Script', unset; color:var(--margin);
  width:42px; height:42px; min-width:42px; border-radius:50%;
  border:2px solid var(--margin); display:flex; align-items:center; justify-content:center;
  font-size:1.35rem; margin-right:14px;
}
#app .assign-head{ display:flex; align-items:center; margin-bottom:10px; }
#app .assign-head .grow{ flex:1; }
#app .assign-actions{ display:flex; gap:6px; }

#app .empty{
  border:2px dashed var(--rule); border-radius:6px; padding:40px 24px; text-align:center; color:var(--ink-soft);
}
#app .empty .doodle{ font-family:'Marck Script',cursive; color:var(--margin); font-size:1.6rem; display:block; margin-bottom:8px; }

#app .pill{ display:inline-block; font-family:'PT Mono',monospace; font-size:0.78rem; background:var(--rule); color:var(--ink); border-radius:4px; padding:2px 8px; margin-right:6px; }
#app .meta{ color:var(--ink-soft); font-size:0.85rem; font-family:'PT Mono',monospace; }
#app .row{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
#app .toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:12px 22px; border-radius:8px; font-weight:700;
  box-shadow:var(--shadow); z-index:50; opacity:0; transition:opacity .25s;
}
#app .toast.show{ opacity:1; }

#app .linkbox{ display:flex; gap:8px; margin-top:10px; }
#app .linkbox input{ border:2px solid var(--rule); border-radius:6px; padding:8px 10px; font-family:'PT Mono',monospace; font-size:0.85rem; }

#app .setlist{ display:grid; gap:16px; }
#app .setcard{ background:var(--white); border-radius:4px; box-shadow:var(--shadow); padding:20px 22px; border-left:5px solid var(--margin); }
#app .setcard h3{ font-size:1.15rem; }
#app .setcard .subj{ font-family:'Marck Script',cursive; color:var(--margin); font-size:1.3rem; }

#app img.preview{ max-width:352px; max-height:256px; border-radius:4px; display:block; margin-top:8px; border:2px solid var(--rule); transition:max-width .15s, max-height .15s; }
#app .img-zoom-wrap{ display:inline-block; margin-top:8px; }
#app .img-zoom-controls{ display:flex; gap:6px; align-items:center; margin-top:6px; }
#app .img-zoom-controls button{
  padding:2px 10px; font-size:0.85rem; min-width:32px;
  border-radius:6px; border:2px solid var(--ink); background:var(--white); color:var(--ink);
  cursor:pointer; font-weight:700; font-family:'PT Sans',sans-serif;
}
#app .img-zoom-controls button:hover{ background:var(--paper); }
#app .img-zoom-controls .zoom-label{ font-family:'PT Mono',monospace; font-size:0.78rem; color:var(--ink-soft); min-width:42px; text-align:center; }
#app .filechip{ display: flex; align-items:center; gap:8px; background:var(--rule); border:2px solid var(--rule); border-radius:6px; padding:6px 12px; font-family:'PT Mono',monospace; font-size:0.82rem; margin-top:8px; width:auto; max-width:30%; }

#app table.ans-table{ width:56%; border-collapse:collapse; margin-top:10px; }
#app table.ans-table th, #app table.ans-table td{ border:1px solid var(--rule); padding:6px 8px; text-align:left; }
#app table.ans-table th{ background:var(--paper); font-size:0.82rem; color:var(--ink-soft); }
#app table.ans-table input{
  border:1px solid var(--rule) !important; border-radius:4px; padding:6px 8px; width:100%;
  background:var(--white) !important; color:var(--ink); caret-color:var(--margin);
  font-family:'PT Sans',sans-serif; font-size:0.98rem; min-height:32px;
  box-sizing:border-box; outline:none;
  pointer-events:auto !important; -webkit-user-select:text; user-select:text;
  position:relative; z-index:2;
}
#app table.ans-table input:focus{
  border-color:var(--margin) !important; background:#fff !important;
  box-shadow:0 0 0 2px rgba(192,57,43,0.15);
}
#app .student-answer-wrap table.ans-table input{
  border:1px solid #000 !important; min-height:36px;
}
#app table.ans-table .rowdel, #app table.ans-table .coldel{ text-align:center; cursor:pointer; color:var(--margin); font-weight:700; user-select:none; }
#app table.ans-table td.static, #app table.ans-table th.static{ background:#FCFBF6; }

#app textarea.ansText{
  border:1px solid var(--ink);
  border-radius:6px;
  padding:5px 12px;
  background:var(--white);
  min-height:20px;
  width:30%;
  box-sizing:border-box;
  
  
}
#app textarea.ansText:focus{ border-color:var(--margin); outline:none; }
#app .student-answer-wrap{
  border:1px solid var(--ink);
  border-radius:6px;
  padding: 5px;
  background:var(--white);
  margin-top:8px;
  display:inline-block;
  max-width:45%;
  
}
#app .student-answer-wrap table.ans-table{ width:100%; margin-top:0; }

#app table.result-table{ width:40%; border-collapse:collapse; margin:12px 0 8px; }
#app table.result-table th, #app table.result-table td{ border:1px solid var(--rule); padding:8px 10px; text-align:left; vertical-align:top; }
#app table.result-table th{ background:var(--paper); font-size:0.82rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
#app table.result-table td.num{ width:48px; text-align:center; font-weight:700; color:var(--ink-soft); }
#app table.result-table .ans-ok{ background:#E8F5E9; color:#1B5E20; }
#app table.result-table .ans-bad{ background:#FFEBEE; color:#B71C1C; }
#app table.result-table .ans-empty{ color:var(--ink-soft); }
#app table.result-table .mini-table{ width:auto; max-width:100%; font-size:0.88rem; margin:0; }
#app table.result-table .mini-table th, #app table.result-table .mini-table td{ padding:3px 6px; }
#app .score-line{ font-family:'PT Mono',monospace; font-size:0.95rem; color:var(--ink); margin-top:6px; }

#app .radio-group{ display:flex; gap:18px; margin-top:4px; }
#app .radio-group label{ display:flex; align-items:center; gap:6px; font-size:0.92rem; cursor:pointer; }

#app .backlink{ display:inline-block; margin-bottom:18px; color:var(--ink-soft); font-weight:700; text-decoration:none; cursor:pointer; }
#app .backlink:hover{ text-decoration:underline; }

#app .studentbox{ background:var(--white); border-radius:6px; box-shadow:var(--shadow); padding:26px; max-width:420px; margin:40px auto; text-align:center; }
#app .checkbig{ font-size:3rem; color:var(--green); font-family:'Marck Script',cursive; }
#app .divider{ border:none; border-top:2px dashed var(--rule); margin:22px 0; }
#app .fade-in{ animation:appfadein .3s ease; }
@keyframes appfadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
#app .respcard{ border-bottom:1px solid var(--rule); padding:14px 0; }
#app .respcard:last-child{ border-bottom:none; }
#app .warn{ color:var(--margin); font-size:0.85rem; margin-top:4px; }
#app .answerblock{ margin-top:10px; }
#app .answerblock .tag{ font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; display:block; }
#app .answerblock.student .tag{ color:var(--ink-soft); }
#app .answerblock.correct .tag{ color:var(--green); }
#app .tablebuilder-actions{ margin-top:8px; display:flex; gap:8px; }
#app .content-blocks{ display:flex; flex-direction:column; gap:12px; margin-top:8px; }
#app .content-block{
  background:var(--paper); border:2px solid var(--rule); border-radius:6px; padding:12px 14px; position:relative;
}
#app .content-block .block-actions{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
#app .content-block textarea{
  border:1px solid var(--rule); border-radius:6px; padding:8px 10px; background:var(--white);
  min-height:60px; width:100%; box-sizing:border-box;
}
#app .content-block textarea:focus{ border-color:var(--margin); outline:none; }
#app .content-text{ margin:8px 0; white-space:pre-wrap; }
#app .blocks-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
#app .resp-summary{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  cursor:pointer; user-select:none;
}
#app .resp-summary:hover .resp-arrow{ color:var(--margin); }
#app .resp-arrow{
  font-size:1.1rem; color:var(--ink-soft); transition:transform .15s ease; min-width:28px; text-align:center;
  border:none; background:transparent; padding:4px 8px; cursor:pointer; font-weight:700;
}
#app .resp-arrow.open{ transform:rotate(90deg); color:var(--margin); }
#app .resp-detail{ display:none; margin-top:14px; }
#app .resp-detail.open{ display:block; }
#app .quill-wrap{
  background:var(--white); border:2px solid var(--rule); border-radius:8px; overflow:visible;
  transition:border-color .15s, box-shadow .15s;
}
#app .quill-wrap .ql-container{ border-radius:0 0 8px 8px; overflow:hidden; }
#app .quill-wrap .ql-toolbar.ql-snow{ border-radius:8px 8px 0 0; position:relative; z-index:5; }
#app .quill-wrap .ql-snow .ql-picker.ql-expanded{ z-index:20; }
#app .quill-wrap .ql-snow .ql-picker.ql-expanded .ql-picker-options{
  z-index:30; max-height:220px; overflow:auto;
  border:1px solid var(--rule); border-radius:6px; box-shadow:var(--shadow);
}
#app .quill-wrap:focus-within{
  border-color:var(--margin);
  box-shadow:0 0 0 3px rgba(192,57,43,0.12);
}
#app .quill-wrap .ql-toolbar.ql-snow{
  border:none; border-bottom:1px solid var(--rule); background:var(--paper);
  font-family:'PT Sans',sans-serif; flex-wrap:wrap; padding:6px 8px;
}
#app .quill-wrap .ql-container.ql-snow{
  border:none; font-family:'PT Sans',sans-serif; font-size:0.98rem; color:var(--ink);
  min-height:15vh; height:auto;
}
#app .quill-wrap .ql-editor{
  min-height:15vh; height:auto; overflow-y:hidden; line-height:1.55;
  resize:none;
}
#app .quill-wrap .ql-editor.ql-blank::before{ color:var(--ink-soft); font-style:normal; }
#app .quill-wrap .ql-editor img{
  max-width:100%; height:auto; border-radius:4px;
  display:inline-block; vertical-align:middle;
}
#app .quill-wrap .ql-editor .ql-align-center img{
  display:block; margin-left:auto; margin-right:auto;
}
#app .quill-wrap .ql-editor .ql-align-right img{
  display:block; margin-left:auto; margin-right:0;
}
#app .quill-wrap .ql-editor .ql-align-left img,
#app .quill-wrap .ql-editor .ql-align-justify img{
  display:block; margin-left:0; margin-right:auto;
}
#app .quill-wrap .ql-snow .ql-stroke{ stroke:var(--ink); }
#app .quill-wrap .ql-snow .ql-fill{ fill:var(--ink); }
#app .quill-wrap .ql-snow .ql-picker{ color:var(--ink); }
#app .quill-wrap .ql-toolbar.ql-snow button{
  display:inline-flex !important; align-items:center; justify-content:center;
  width:auto !important; height:32px !important; min-width:32px;
  padding:4px 8px !important; border-radius:6px !important;
  font-size:1.05rem !important; line-height:1 !important;
}
#app .quill-wrap .ql-toolbar.ql-snow button.ql-icon-btn svg{ display:none !important; }
#app .quill-wrap .ql-toolbar.ql-snow .ql-picker-label{
  display:inline-flex !important; align-items:center; height:32px !important;
  padding:4px 8px !important; border-radius:6px !important;
}
/* выпадающие списки — стандартные иконки Quill, чтобы работали */
#app .quill-wrap .ql-toolbar.ql-snow .ql-picker-label svg{ display:inline-block !important; }
#app .quill-wrap .ql-snow.ql-toolbar button:hover,
#app .quill-wrap .ql-snow .ql-toolbar button:hover,
#app .quill-wrap .ql-toolbar.ql-snow .ql-picker-label:hover{
  background:rgba(34,49,74,0.08) !important; border-radius:6px;
}
#app .quill-wrap .ql-snow.ql-toolbar button.ql-active,
#app .quill-wrap .ql-snow .ql-toolbar button.ql-active{
  background:rgba(192,57,43,0.12) !important; border-radius:6px;
}
#app .rich-content{ margin:8px 0; line-height:1.55; color:var(--ink); }
#app .rich-content img{
  max-width:min(100%, 480px); height:auto; border-radius:4px;
  display:inline-block; vertical-align:middle;
  margin:10px 0; border:2px solid var(--rule);
}
#app .rich-content .ql-align-center img{
  display:block; margin-left:auto; margin-right:auto;
}
#app .rich-content .ql-align-right img{
  display:block; margin-left:auto; margin-right:0;
}
#app .rich-content .ql-align-left img,
#app .rich-content .ql-align-justify img{
  display:block; margin-left:0; margin-right:auto;
}
#app .rich-content p{ margin:0 0 10px; }
#app .rich-content h1,#app .rich-content h2,#app .rich-content h3{
  font-family:'PT Sans',sans-serif; font-weight:700; margin:0 0 8px; color:var(--ink);
}
#app .rich-content ul, #app .rich-content ol{ margin:0 0 10px; padding-left:1.4em; }
#app .rich-content a{ color:var(--margin); }
#app .rich-content blockquote{
  margin:8px 0; padding:6px 12px; border-left:3px solid var(--margin);
  background:var(--paper); color:var(--ink-soft);
}
#app .rich-content pre.ql-syntax,
#app .rich-content pre{
  background:var(--paper); border:1px solid var(--rule); border-radius:6px;
  padding:10px 12px; overflow:auto; font-family:'PT Mono',monospace; font-size:0.9rem;
}
#app .rich-content .ql-align-center{ text-align:center; }
#app .rich-content .ql-align-right{ text-align:right; }
#app .rich-content .ql-align-justify{ text-align:justify; }
#app .rich-content .ql-indent-1{ padding-left:1.5em; }
#app .rich-content .ql-indent-2{ padding-left:3em; }
#app .rich-content .ql-indent-3{ padding-left:4.5em; }
/* размер и шрифт текста (Quill) */
#app .quill-wrap .ql-editor .ql-size-small,
#app .rich-content .ql-size-small{ font-size:0.75em; }
#app .quill-wrap .ql-editor .ql-size-large,
#app .rich-content .ql-size-large{ font-size:1.5em; }
#app .quill-wrap .ql-editor .ql-size-huge,
#app .rich-content .ql-size-huge{ font-size:2.5em; }
#app .quill-wrap .ql-editor .ql-font-serif,
#app .rich-content .ql-font-serif{ font-family:Georgia,'Times New Roman',serif; }
#app .quill-wrap .ql-editor .ql-font-monospace,
#app .rich-content .ql-font-monospace{ font-family:'PT Mono',Consolas,monospace; }
#app .quill-wrap .ql-editor .ql-font-script,
#app .rich-content .ql-font-script{ font-family:'Marck Script',cursive; }
#app .quill-wrap .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="serif"]::before,
#app .quill-wrap .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="serif"]::before{ content:'Serif'; font-family:Georgia,serif; }
#app .quill-wrap .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="monospace"]::before,
#app .quill-wrap .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="monospace"]::before{ content:'Моно'; font-family:monospace; }
#app .quill-wrap .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="script"]::before,
#app .quill-wrap .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="script"]::before{ content:'Рукопись'; font-family:'Marck Script',cursive; }
#app .quill-wrap .ql-snow .ql-picker.ql-font .ql-picker-label::before,
#app .quill-wrap .ql-snow .ql-picker.ql-font .ql-picker-item::before{ content:'Sans'; }
#app .quill-wrap .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="small"]::before,
#app .quill-wrap .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="small"]::before{ content:'Мелкий'; }
#app .quill-wrap .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="large"]::before,
#app .quill-wrap .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="large"]::before{ content:'Крупный'; }
#app .quill-wrap .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="huge"]::before,
#app .quill-wrap .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="huge"]::before{ content:'Очень крупный'; }
#app .quill-wrap .ql-snow .ql-picker.ql-size .ql-picker-label::before,
#app .quill-wrap .ql-snow .ql-picker.ql-size .ql-picker-item::before{ content:'Обычный'; }
#app .quill-wrap .ql-editor .ql-table-wrap,
#app .rich-content .ql-table-wrap{
  margin:10px 0; overflow-x:auto;
  display:table; max-width:100%;
}
/* выравнивание таблицы: слева / центр / справа */
#app .quill-wrap .ql-editor .ql-table-wrap[data-align="center"],
#app .rich-content .ql-table-wrap[data-align="center"],
#app .quill-wrap .ql-editor .ql-align-center > .ql-table-wrap,
#app .rich-content .ql-align-center .ql-table-wrap{
  margin-left:auto; margin-right:auto;
}
#app .quill-wrap .ql-editor .ql-table-wrap[data-align="right"],
#app .rich-content .ql-table-wrap[data-align="right"],
#app .quill-wrap .ql-editor .ql-align-right > .ql-table-wrap,
#app .rich-content .ql-align-right .ql-table-wrap{
  margin-left:auto; margin-right:0;
}
#app .quill-wrap .ql-editor .ql-table-wrap[data-align="left"],
#app .rich-content .ql-table-wrap[data-align="left"]{
  margin-left:0; margin-right:auto;
}
#app .quill-wrap .ql-editor table,
#app .rich-content table{
  border-collapse:collapse; width:auto; max-width:100%;
  margin:8px 0; background:var(--white);
  border:1px solid #000;
}
#app .quill-wrap .ql-editor table td,
#app .quill-wrap .ql-editor table th,

</style>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
(function(){
  const root = document.getElementById('app');
  const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const fmtDate = ts => new Date(ts).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const linkFor = id => location.origin + location.pathname + '#student=' + encodeURIComponent(id);
  // ---------- безопасность ----------
  const SAFE_ID_RE = /^[a-zA-Z0-9_-]{1,64}$/;
  function isSafeId(id){ return typeof id === 'string' && SAFE_ID_RE.test(id); }
  function safeParseJson(raw, fallback){
    try{ return raw == null ? fallback : JSON.parse(raw); }
    catch(e){ return fallback; }
  }
  function isSafeDataUrl(url, kind){
    if(typeof url !== 'string' || url.length > 6 * 1024 * 1024) return false;
    if(kind === 'image') return /^data:image\/(png|jpe?g|gif|webp|svg\+xml);base64,/i.test(url);
    // файлы заданий: data:application/... или text/
    return /^data:(image\/(png|jpe?g|gif|webp)|application\/(pdf|octet-stream|vnd\.[a-z0-9.-]+)|text\/plain);base64,/i.test(url)
      || /^data:[a-z0-9.+-]+\/[a-z0-9.+-]+;base64,/i.test(url);
  }
  function isSafeHref(href){
    if(typeof href !== 'string' || !href.trim()) return false;
    const h = href.trim();
    if(/^\s*javascript:/i.test(h) || /^\s*vbscript:/i.test(h) || /^\s*data:text\/html/i.test(h)) return false;
    if(h.startsWith('#') || h.startsWith('/') || /^https?:\/\//i.test(h) || /^mailto:/i.test(h)) return true;
    if(h.startsWith('data:image/')) return true;
    return false;
  }
  // Санитизация HTML из редактора (XSS)
  function sanitizeHtml(html){
    if(!html || typeof html !== 'string') return '';
    const tmpl = document.createElement('template');
    tmpl.innerHTML = html;
    const forbidden = /^(script|iframe|object|embed|form|input|button|textarea|select|meta|link|base|style|svg|math|frame|frameset)$/i;
    const walk = (node) => {
      const children = [...node.childNodes];
      children.forEach(ch => {
        if(ch.nodeType === 1){
          const tag = ch.tagName;
          if(forbidden.test(tag)){ ch.remove(); return; }
          // атрибуты
          [...ch.attributes].forEach(attr => {
            const name = attr.name.toLowerCase();
            const val = attr.value || '';
            if(name.startsWith('on') || name === 'srcdoc' || name === 'xlink:href'){
              ch.removeAttribute(attr.name);
              return;
            }
            if((name === 'href' || name === 'src') && !isSafeHref(val)){
              ch.removeAttribute(attr.name);
              return;
            }
            // style: убрать expression / url(javascript
            if(name === 'style' && /expression\s*\(|javascript:|behavior\s*:/i.test(val)){
              ch.removeAttribute(attr.name);
            }
          });
          walk(ch);
        } else if(ch.nodeType === 8){
          // комментарии
          ch.remove();
        }
      });
    };
    walk(tmpl.content);
    return tmpl.innerHTML;
  }
  function clampStr(s, max){
    s = String(s == null ? '' : s);
    return s.length > max ? s.slice(0, max) : s;
  }

  function toast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 2200);
  }

  // ---------- Firebase ----------
  // Если Realtime Database в другом регионе — замените databaseURL
  // на тот, что показан в консоли Firebase → Realtime Database.
  const firebaseConfig = {
    apiKey: "AIzaSyAg8nVp7WZHbWjDP8pWbr1qo7kmLAuciAA",
    authDomain: "tetrad-zadaniy.firebaseapp.com",
    databaseURL: "https://tetrad-zadaniy-default-rtdb.firebaseio.com",
    projectId: "tetrad-zadaniy",
    storageBucket: "tetrad-zadaniy.firebasestorage.app",
    messagingSenderId: "205484764365",
    appId: "1:205484764365:web:f6e75353945db331634d84",
    measurementId: "G-M8B8YJ0WCK"
  };

  let fbDb = null;
  let fbAuth = null;
  let fbReady = false;
  try{
    if(typeof firebase !== 'undefined'){
      firebase.initializeApp(firebaseConfig);
      fbDb = firebase.database();
      fbAuth = firebase.auth();
      fbReady = true;
    }
  }catch(e){
    console.error('Firebase init failed', e);
  }

  function fbSafeKey(key){
    // Firebase не любит некоторые символы в путях; : оставляем
    return String(key).replace(/[.#$\[\]]/g, '_');
  }

  // ---------- storage helpers ----------
  // shared=true  → Firebase (видно всем по ссылке)
  // shared=false → localStorage (список «моих» наборов только на этом устройстве)
  const LS_PREFIX = 'tetrad:';
  function lsKey(key, shared){
    return LS_PREFIX + (shared ? 'shared:' : 'local:') + key;
  }

  async function sGet(key, shared){
    if(shared && fbReady){
      try{
        const snap = await fbDb.ref('kv/' + fbSafeKey(key)).once('value');
        const v = snap.val();
        return v == null ? null : v;
      }catch(e){
        console.error('fb get', e);
        toast('Ошибка чтения из Firebase. Проверьте databaseURL и Rules.');
        return null;
      }
    }
    try{ return localStorage.getItem(lsKey(key, shared)); }
    catch(e){ return null; }
  }

  async function sSet(key, value, shared){
    if(shared && fbReady){
      try{
        await fbDb.ref('kv/' + fbSafeKey(key)).set(value);
        return true;
      }catch(e){
        console.error('fb set', e);
        toast('Ошибка сохранения в Firebase. Проверьте Rules и databaseURL.');
        return null;
      }
    }
    try{
      localStorage.setItem(lsKey(key, shared), value);
      return true;
    }catch(e){
      console.error('localStorage set failed', e);
      return null;
    }
  }

  async function sDelete(key, shared){
    if(shared && fbReady){
      try{
        await fbDb.ref('kv/' + fbSafeKey(key)).remove();
        return true;
      }catch(e){
        console.error('fb delete', e);
        return null;
      }
    }
    try{ localStorage.removeItem(lsKey(key, shared)); return true; }
    catch(e){ return null; }
  }

  async function sList(prefix, shared){
    if(shared && fbReady){
      try{
        const snap = await fbDb.ref('kv').once('value');
        const val = snap.val() || {};
        const p = fbSafeKey(prefix);
        return Object.keys(val).filter(k => k.startsWith(p) || k.startsWith(prefix));
      }catch(e){
        console.error('fb list', e);
        return [];
      }
    }
    const fullPrefix = lsKey(prefix, shared);
    const keys = [];
    try{
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(fullPrefix)){
          keys.push(k.slice(lsKey('', shared).length));
        }
      }
    }catch(e){}
    return keys;
  }

  if(!fbReady){
    setTimeout(() => toast('Firebase не загрузился — данные только локально'), 500);
  }

  function mySetsKey(){
    if(!fbAuth || !fbAuth.currentUser) return null;
    return 'my-sets:' + fbAuth.currentUser.uid;
  }

  async function getMySetIds(){
    const key = mySetsKey();
    if(!key) return [];
    const v = await sGet(key, true);  // Firebase, привязано к UID
    const parsed = safeParseJson(v, []);
    return Array.isArray(parsed) ? parsed.filter(isSafeId) : [];
  }
  async function addMySetId(id){
    const key = mySetsKey();
    if(!key) return;
    const ids = await getMySetIds();
    if(!ids.includes(id)){
      ids.push(id);
      await sSet(key, JSON.stringify(ids), true);
    }
  }
  async function removeMySetId(id){
    const key = mySetsKey();
    if(!key) return;
    const ids = (await getMySetIds()).filter(x => x !== id);
    await sSet(key, JSON.stringify(ids), true);
  }

  // Одноразовая миграция старых my-sets из localStorage → Firebase (по UID)
  async function migrateLocalMySets(){
    const key = mySetsKey();
    if(!key) return;
    const remote = await getMySetIds();
    if(remote.length) return; // уже есть в Firebase
    try{
      const localRaw = await sGet('my-sets', false);
      if(!localRaw) return;
      const local = JSON.parse(localRaw);
      if(Array.isArray(local) && local.length){
        await sSet(key, JSON.stringify(local), true);
        console.log('Migrated', local.length, 'sets from localStorage to Firebase');
      }
    }catch(e){
      console.error('migrateLocalMySets failed', e);
    }
  }

  async function loadSetMeta(id){
    if(!isSafeId(id)) return null;
    const v = await sGet('set:'+id, true);
    return safeParseJson(v, null);
  }
  async function loadAssignment(setId, aId){
    if(!isSafeId(setId) || !isSafeId(aId)) return null;
    const v = await sGet('assignment:'+setId+':'+aId, true);
    return safeParseJson(v, null);
  }
  async function loadAllAssignments(meta){
    const list = await Promise.all((meta.assignmentIds||[]).map(id=>loadAssignment(meta.id,id)));
    return list.filter(Boolean);
  }

  // ---------- file helpers ----------
  function fileToDataURL(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('read failed'));
      r.readAsDataURL(file);
    });
  }
  const MAX_BYTES = 3.2 * 1024 * 1024;

  // Нормализация старых данных (один image/file) → массивы
  function getImages(a){
    if(a.images && a.images.length) return a.images;
    if(a.image) return [{ dataUrl: a.image, name: a.imageName || 'image' }];
    return [];
  }
  function getFiles(a){
    if(a.files && a.files.length) return a.files;
    if(a.file) return [{ dataUrl: a.file, name: a.fileName || 'file' }];
    return [];
  }

  // Условие задания: Quill HTML (+ совместимость со старыми блоками)
  function getContentBlocks(a){
    if(a.contentBlocks && a.contentBlocks.length) return a.contentBlocks;
    const blocks = [];
    if(a.text && String(a.text).trim()) blocks.push({ type: 'text', value: a.text });
    getImages(a).forEach(img => blocks.push({ type: 'image', dataUrl: img.dataUrl, name: img.name || 'image' }));
    return blocks;
  }
  function blocksToText(blocks){
    return (blocks || []).filter(b => b.type === 'text').map(b => b.value || '').join('\n').trim();
  }
  function blocksToImages(blocks){
    return (blocks || []).filter(b => b.type === 'image').map(b => ({ dataUrl: b.dataUrl, name: b.name || 'image' }));
  }
  function blocksToHtml(blocks){
    if(!blocks || !blocks.length) return '';
    return blocks.map(b => {
      if(b.type === 'image' && b.dataUrl) return `<p><img src="${b.dataUrl}"></p>`;
      if(b.type === 'text' && b.value) return `<p>${esc(b.value).replace(/\n/g, '<br>')}</p>`;
      return '';
    }).join('');
  }
  function getAssignmentHtml(a){
    if(a.html && String(a.html).trim() && a.html !== '<p><br></p>') return sanitizeHtml(a.html);
    return blocksToHtml(getContentBlocks(a));
  }
  function htmlToPlainText(html){
    if(!html) return '';
    const d = document.createElement('div');
    d.innerHTML = sanitizeHtml(html);
    return (d.textContent || '').trim();
  }
  function renderAssignmentBody(a){
    const html = getAssignmentHtml(a);
    if(html) return `<div class="rich-content">${html}</div>`;
    return '';
  }
  function renderContentBlocksHtml(blocks){
    if(!blocks || !blocks.length) return '';
    return blocks.map(b => {
      if(b.type === 'image' && b.dataUrl) return buildZoomableImage(b.dataUrl);
      if(b.type === 'text' && b.value) return `<div class="content-text">${esc(b.value).replace(/\n/g, '<br>')}</div>`;
      return '';
    }).join('');
  }

  // ---------- table builder rendering (shared markup helper) ----------
  function buildTableHtml(columns, rows, opts){
    opts = opts || {};
    const editableHeader = !!opts.editableHeader;
    const editableCells = !!opts.editableCells;
    const withColDel = !!opts.withColDel;
    const withRowDel = !!opts.withRowDel;
    let head = '<tr>';
    columns.forEach((c,ci) => {
      head += `<th>${editableHeader
        ? `<input type="text" class="colhead" data-ci="${ci}" value="${esc(c)}" placeholder="Заголовок">`
        : esc(c)}${withColDel ? ` <span class="coldel" data-ci="${ci}" title="Удалить столбец">✕</span>` : ''}</th>`;
    });
    if(withRowDel) head += '<th></th>';
    head += '</tr>';
    let body = rows.map((row,ri) => {
      let tr = '<tr>' + row.map((cell,ci) => `<td>${editableCells
        ? `<input type="text" class="cellval" data-ri="${ri}" data-ci="${ci}" value="${esc(cell)}">`
        : esc(cell)}</td>`).join('');
      if(withRowDel) tr += `<td class="rowdel" data-ri="${ri}" title="Удалить строку">✕</td>`;
      return tr + '</tr>';
    }).join('');
    return `<table class="ans-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }

  const IMG_BASE_W = 100;
  const IMG_BASE_H = 50;
  function buildZoomableImage(src){
    if(!isSafeDataUrl(src, 'image') && !/^https:\/\//i.test(src || '')) return '';
    const id = 'zim_' + Math.random().toString(36).slice(2, 9);
    return `<div class="img-zoom-wrap" data-zoom-id="${id}">
      <img class="preview" id="${id}" src="${esc(src)}" style="max-width:${IMG_BASE_W}%;max-height:${IMG_BASE_H}%;" data-scale="1">
    </div>`;
  }
  function bindZoomControls(rootEl){
    (rootEl || document).querySelectorAll('.img-zoom-wrap').forEach(wrap => {
      if(wrap.dataset.bound) return;
      wrap.dataset.bound = '1';
      const img = wrap.querySelector('img.preview');
      const label = wrap.querySelector('.zoom-label');
      const btnIn = wrap.querySelector('.zoom-in');
      const btnOut = wrap.querySelector('.zoom-out');
      if(!img || !btnIn || !btnOut) return;
      const apply = (scale) => {
        scale = Math.max(0.4, Math.min(3, scale));
        img.dataset.scale = String(scale);
        img.style.maxWidth = Math.round(IMG_BASE_W * scale) + '%';
        img.style.maxHeight = Math.round(IMG_BASE_H * scale) + '%';
        if(label) label.textContent = Math.round(scale * 100) + '%';
      };
      btnIn.onclick = () => apply(parseFloat(img.dataset.scale || '1') + 0.2);
      btnOut.onclick = () => apply(parseFloat(img.dataset.scale || '1') - 0.2);
    });
  }

  // ================= admin auth (Firebase Authentication) =================
  // Пароль больше НЕ хранится в коде.
  // Создайте пользователя в Firebase Console → Authentication → Users.

  function isAdminAuthed(){
    return !!(fbAuth && fbAuth.currentUser);
  }

  function renderAdminLogin(onSuccess){
    root.innerHTML = `
      <div class="brand"></div>
      <div class="studentbox fade-in">
        <h2>Вход администратора</h2>
        <label class="field">
          <input type="email" id="adminEmail" placeholder="teacher@example.com" autocomplete="username">
        </label>
        <label class="field">
          <div class="pass-wrap">
            <input type="password" id="adminPass" placeholder="Пароль" autocomplete="current-password">
            <button type="button" class="pass-toggle" id="btnTogglePass" title="Показать пароль" aria-label="Показать пароль">👁</button>
          </div>
        </label>
        <div class="warn" id="adminWarn"></div>
        <button class="primary" id="btnAdminLogin">Войти</button>
      </div>
    `;
    const emailInput = document.getElementById('adminEmail');
    const passInput = document.getElementById('adminPass');
    const warn = document.getElementById('adminWarn');
    const btn = document.getElementById('btnAdminLogin');
    const toggleBtn = document.getElementById('btnTogglePass');

    toggleBtn.onclick = () => {
      const show = passInput.type === 'password';
      passInput.type = show ? 'text' : 'password';
      toggleBtn.textContent = show ? '🙈' : '👁';
      toggleBtn.title = show ? 'Скрыть пароль' : 'Показать пароль';
      toggleBtn.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
      passInput.focus();
    };

    const tryLogin = async () => {
      const email = emailInput.value.trim();
      const password = passInput.value;
      warn.textContent = '';
      if(!email || !password){
        warn.textContent = 'Введите email и пароль.';
        return;
      }
      if(!fbAuth){
        warn.textContent = 'Firebase Auth не загрузился.';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Вход…';
      try{
        await fbAuth.signInWithEmailAndPassword(email, password);
        onSuccess();
      }catch(e){
        console.error(e);
        let msg = 'Ошибка входа.';
        if(e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential'){
          msg = 'Неверный email или пароль.';
        } else if(e.code === 'auth/invalid-email'){
          msg = 'Некорректный email.';
        } else if(e.code === 'auth/too-many-requests'){
          msg = 'Слишком много попыток. Попробуйте позже.';
        }
        warn.textContent = msg;
        btn.disabled = false;
        btn.textContent = 'Войти';
        passInput.select();
      }
    };

    btn.onclick = tryLogin;
    passInput.onkeydown = (e) => { if(e.key === 'Enter') tryLogin(); };
    emailInput.onkeydown = (e) => { if(e.key === 'Enter') passInput.focus(); };
    emailInput.focus();
  }

  function requireAdmin(thenFn){
    if(!fbAuth){
      // Firebase не загрузился — показываем форму (она сама напишет ошибку)
      return renderAdminLogin(thenFn);
    }
    // Ждём актуальное состояние авторизации
    const unsub = fbAuth.onAuthStateChanged(user => {
      unsub();
      if(user) thenFn();
      else renderAdminLogin(thenFn);
    });
  }

  // ================= router =================
  function route(){
    let h = '';
    try{ h = decodeURIComponent(location.hash.slice(1) || ''); }
    catch(e){ h = location.hash.slice(1) || ''; }
    if(h.startsWith('student=')){
      const id = h.slice(8);
      if(!isSafeId(id)){ root.innerHTML = `<div class="empty">Некорректная ссылка.</div>`; return; }
      return renderStudent(id);
    }
    if(h.startsWith('responses=')){
      const id = h.slice(10);
      if(!isSafeId(id)){ root.innerHTML = `<div class="empty">Некорректный набор.</div>`; return; }
      return requireAdmin(() => renderResponses(id));
    }
    if(h.startsWith('edit=')){
      const id = h.slice(5);
      if(!isSafeId(id)){ root.innerHTML = `<div class="empty">Некорректный набор.</div>`; return; }
      return requireAdmin(() => renderEditor(id));
    }
    if(h === 'new') return requireAdmin(() => renderEditor(null));
    if(h === '' || h === 'admin') return requireAdmin(() => renderDashboard());
    root.innerHTML = `<div class="empty">Страница не найдена.</div>`;
  }
  window.addEventListener('hashchange', route);
  route();

  // ================= DASHBOARD =================
  async function renderDashboard(){
    root.innerHTML = `
      <div class="topbar">
        <div class="row">
          <button class="primary" id="btnNew">Новый набор заданий</button>
          <button class="ghost" id="btnLogout">Выйти</button>
        </div>
      </div>
      <div id="listWrap">Загрузка…</div>
    `;

  async function renderEditor(setId){

    };
    let pendingSetFiles = (draft.files || []).map(f => ({ dataUrl: f.dataUrl, name: f.name })); // файлы набора
    let pendingHtml = '';  // HTML условия из Quill

    function freshTableDraft(){ return { columns:['1'], rows:[['']] }; }
    function ensureQuillTableBlot(){
      if(typeof Quill === 'undefined') return;
      if(Quill.__tableBlotReady) return;
      try{
        const BlockEmbed = Quill.import('blots/block/embed');
        class TableBlot extends BlockEmbed {
          static create(value){
            const node = super.create();
            node.setAttribute('contenteditable', 'false');
            const html = typeof value === 'string' ? value : (value && value.html) || '';
            node.innerHTML = html;
            TableBlot.decorate(node);
            return node;
          }
          static decorate(node){
            if(!node) return;
            let del = node.querySelector(':scope > .ql-table-del');
            if(!del){
              del = document.createElement('button');
              del.type = 'button';
              del.className = 'ql-table-del';
              del.title = 'Удалить таблицу';
              del.textContent = '✕';
              node.insertBefore(del, node.firstChild);
            }
            del.onmousedown = (e) => e.preventDefault();
            del.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              if(!confirm('Удалить эту таблицу?')) return;
              const blot = Quill.find(node);
              if(blot) blot.remove();
              else node.remove();
            };
            node.querySelectorAll('td, th').forEach(cell => {
              cell.setAttribute('contenteditable', 'true');
              cell.style.textAlign = 'center';
              cell.style.verticalAlign = 'middle';
              cell.onmousedown = (e) => e.stopPropagation();
              cell.onclick = (e) => { e.stopPropagation(); cell.focus(); };
            });
          }
          static value(node){
            const clone = node.cloneNode(true);
            clone.querySelectorAll('.ql-table-del').forEach(b => b.remove());
            return clone.innerHTML;
          }
        }
        TableBlot.blotName = 'tableEmbed';
        TableBlot.tagName = 'DIV';
        TableBlot.className = 'ql-table-wrap';
        Quill.register(TableBlot, true);
        Quill.register({ 'formats/tableEmbed': TableBlot }, true);
        Quill.__tableBlotReady = true;
      }catch(e){
        console.error('TableBlot register failed', e);
      }
    }
    function insertTableAt(quill, index, tableHtml){
      ensureQuillTableBlot();
      const len = quill.getLength();
      index = Math.max(0, Math.min(index, Math.max(0, len - 1)));
      try{
        // Delta-вставка надёжнее для кастомных embed
        const Delta = Quill.import('delta');
        const delta = new Delta()
          .retain(index)
          .insert('\n')
          .insert({ tableEmbed: tableHtml })
          .insert('\n');
        quill.updateContents(delta, 'user');
        quill.setSelection(index + 3, 0, 'silent');
        return true;
      }catch(e1){
        console.error('table delta insert failed', e1);
        try{
          quill.insertEmbed(index, 'tableEmbed', tableHtml, 'user');
          quill.insertText(index + 1, '\n', 'user');
          return true;
        }catch(e2){
          console.error('table embed insert failed', e2);
          try{
            // запасной путь: HTML
            quill.clipboard.dangerouslyPasteHTML(index, `<div class="ql-table-wrap">${tableHtml}</div><p><br></p>`);
            setTimeout(() => {
              quill.root.querySelectorAll('.ql-table-wrap').forEach(w => {
                w.setAttribute('contenteditable', 'false');
                try{
                  const Blot = Quill.import('formats/tableEmbed');
                  if(Blot && Blot.decorate) Blot.decorate(w);
                }catch(e){}
              });
            }, 0);
            return true;
          }catch(e3){
            console.error('table paste failed', e3);
            return false;
          }
        }
      }
    }
    function applyTableColors(tableEl, colors){
      if(!tableEl || !colors) return;
      const rows = [...tableEl.querySelectorAll('tr')];
      rows.forEach((tr, ri) => {
        const cells = [...tr.querySelectorAll('th, td')];
        cells.forEach((cell, ci) => {
          // сброс только наших заливок
          if(cell.dataset.tblPaint){
            cell.style.backgroundColor = '';
            delete cell.dataset.tblPaint;
          }
          let bg = '';
          if(colors.col && ci === 0) bg = colors.col;
          if(colors.row && ri === 0) bg = colors.row;
          if(colors.diag && ri === ci) bg = colors.diag;
          if(bg){
            cell.style.backgroundColor = bg;
            cell.dataset.tblPaint = '1';
          }
        });
      });
    }
    function showTableSizeModal(mode){

            </div>

        root.appendChild(backdrop);
        const close = (val) => { backdrop.remove(); resolve(val); };
        backdrop.querySelector('#tblCancel').onclick = () => close(null);
        backdrop.addEventListener('click', (e) => { if(e.target === backdrop) close(null); });
        backdrop.querySelector('#tblOk').onclick = () => {
          const colors = {
            row: backdrop.querySelector('#tblColorRowOn').checked ? backdrop.querySelector('#tblColorRow').value : '',
            col: backdrop.querySelector('#tblColorColOn').checked ? backdrop.querySelector('#tblColorCol').value : '',
            diag: backdrop.querySelector('#tblColorDiagOn').checked ? backdrop.querySelector('#tblColorDiag').value : ''
          };
          if(mode === 'paint'){

          }
          const rows = parseInt(backdrop.querySelector('#tblRows').value, 10);
          const cols = parseInt(backdrop.querySelector('#tblCols').value, 10);
          if(!rows || !cols || rows < 1 || cols < 1 || rows > 20 || cols > 12){
            toast('Укажите строки 1–20 и столбцы 1–12');
            return;
          }
          close({ rows, cols, colors });
        };
        const focusEl = backdrop.querySelector('#tblRows') || backdrop.querySelector('#tblOk');
        if(focusEl && focusEl.focus) focusEl.focus();
      });
    }
    function buildQuillTableHtml(rows, cols, colors){
      rows = Math.max(1, Math.min(20, rows|0));
      cols = Math.max(1, Math.min(12, cols|0));
      colors = colors || {};
      let html = '<table class="ql-inserted-table"><tbody>';
      for(let r = 0; r < rows; r++){
        html += '<tr>';
        for(let c = 0; c < cols; c++){
          let bg = '';
          if(colors.col && c === 0) bg = colors.col;
          if(colors.row && r === 0) bg = colors.row;
          if(colors.diag && r === c) bg = colors.diag;
          const cellStyle = 'text-align:center;vertical-align:middle;' + (bg ? `background-color:${bg};` : '');
          const paintAttr = bg ? ' data-tbl-paint="1"' : '';
          html += `<td style="${cellStyle}" contenteditable="true"${paintAttr}><br></td>`;
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      return html;
    }
    function findFocusedTableWrap(){
      if(!quillEditor) return null;
      const sel = quillEditor.getSelection(true);
      let wrap = null;
      if(sel){
        const leaf = quillEditor.getLeaf(sel.index);
        let node = leaf && leaf[0] && leaf[0].domNode;
        while(node && node !== quillEditor.root){
          if(node.classList && node.classList.contains('ql-table-wrap')){ wrap = node; break; }
          node = node.parentNode;
        }
      }
      if(!wrap){
        const focused = quillEditor.root.querySelector('.ql-table-wrap td:focus, .ql-table-wrap th:focus');
        if(focused) wrap = focused.closest('.ql-table-wrap');
      }
      if(!wrap){
        const all = quillEditor.root.querySelectorAll('.ql-table-wrap');
        wrap = all.length ? all[all.length - 1] : null;
      }
      return wrap;
    }
    function setTableAlign(wrap, align){

      if(a === 'center'){
        wrap.style.marginLeft = 'auto';
        wrap.style.marginRight = 'auto';
      } else if(a === 'right'){
        wrap.style.marginLeft = 'auto';
        wrap.style.marginRight = '0';
      } else {
        wrap.style.marginLeft = '0';
        wrap.style.marginRight = 'auto';
      }
    }
    function initQuill(html){

                ['bold', 'italic', 'underline', 'strike'],
                [{ color: [] }, { background: [] }],
                [{ script: 'sub' }, { script: 'super' }],
                [{ list: 'ordered' }, { list: 'bullet' }, { indent: '-1' }, { indent: '+1' }],

                image: function(){

                  input.onchange = async () => {

              cell.style.textAlign = 'center';
              cell.style.verticalAlign = 'middle';

        const autoResize = () => {

        quillEditor.on('editor-change', autoResize);
        // после картинок/вставки
        quillEditor.root.addEventListener('input', autoResize);
        setTimeout(autoResize, 0);
        window.addEventListener('resize', autoResize);
        // Подсказки; кастомные иконки только у простых кнопок.
        // Стиль / цвет / выравнивание — стандартные виджеты Quill (иначе не работают).
        const tipOnly = [
          ['.ql-header', 'Стиль текста: заголовок или обычный'],
          ['.ql-font', 'Шрифт текста'],
          ['.ql-size', 'Размер текста'],
          ['.ql-color', 'Цвет текста'],
          ['.ql-background', 'Цвет фона'],
          ['.ql-align', 'Выравнивание текста']
        ];
        const iconMap = [
          ['.ql-bold', '𝐁', 'Жирный'],
          ['.ql-italic', '𝐼', 'Курсив'],
          ['.ql-underline', 'U̲', 'Подчёркнутый'],
          ['.ql-strike', 'S̶', 'Зачёркнутый'],
          ['.ql-script[value="sub"]', 'x₂', 'Подстрочный индекс'],
          ['.ql-script[value="super"]', 'x²', 'Надстрочный индекс'],
          ['.ql-list[value="ordered"]', '1.', 'Нумерованный список'],
          ['.ql-list[value="bullet"]', '•', 'Маркированный список'],
          ['.ql-indent[value="-1"]', '⇤', 'Уменьшить отступ'],
          ['.ql-indent[value="+1"]', '⇥', 'Увеличить отступ'],
          ['.ql-blockquote', '❝', 'Цитата'],
          ['.ql-code-block', '</>', 'Блок кода'],
          ['.ql-link', '🔗', 'Вставить ссылку'],
          ['.ql-image', '🖼', 'Вставить картинку'],
          ['.ql-table', '▦', 'Вставить таблицу'],
          ['.ql-table-paint', '🎨', 'Заливка: 1-я строка, 1-й столбец, диагональ'],
          ['.ql-table-delete', '🗑', 'Удалить таблицу'],
          ['.ql-clean', '⨉', 'Очистить форматирование']
        ];
        const bar = el.closest('.quill-wrap') && el.closest('.quill-wrap').querySelector('.ql-toolbar');
        if(bar){
          tipOnly.forEach(([sel, title]) => {
            bar.querySelectorAll(sel).forEach(node => node.setAttribute('title', title));
          });
          iconMap.forEach(([sel, icon, title]) => {
            bar.querySelectorAll(sel).forEach(node => {
              node.setAttribute('title', title);
              node.classList.add('ql-icon-btn');
              const svg = node.querySelector('svg');
              if(svg) svg.style.display = 'none';
              let mark = node.querySelector('.ql-emoji');
              if(!mark){
                mark = document.createElement('span');
                mark.className = 'ql-emoji';
                mark.style.pointerEvents = 'none';
                node.insertBefore(mark, node.firstChild);
              }
              mark.textContent = icon;
            });
          });
          bar.querySelectorAll('.ql-header .ql-picker-item').forEach(item => {
            const v = item.getAttribute('data-value');
            item.setAttribute('title', v === '1' ? 'Заголовок 1' : v === '2' ? 'Заголовок 2' : v === '3' ? 'Заголовок 3' : 'Обычный текст');
          });
          bar.querySelectorAll('.ql-align .ql-picker-item').forEach(item => {
            const v = item.getAttribute('data-value');
            item.setAttribute('title', !v ? 'По левому краю' : v === 'center' ? 'По центру' : v === 'right' ? 'По правому краю' : v === 'justify' ? 'По ширине' : 'Выравнивание');
          });
        }
      }catch(e){
        console.error('Quill init failed', e);
        toast('Не удалось запустить редактор');
      }
    }

        const html = clone.innerHTML;

        return;

      // Показываем по убыванию номера: последнее добавленное сверху
      const order = draft.assignments.map((_, i) => i).reverse();
      wrap.innerHTML = order.map((i, vis) => {
        const a = draft.assignments[i];
        return `
        <div class="card ${vis%2 ? 'tilt-b':'tilt-a'}">
          <div class="assign-head">
            <div class="numcircle">${i+1}</div>
            <div class="grow"></div>
            <div class="assign-actions">
              <button type="button" class="small ghost moveUp" data-i="${i}" title="Выше" ${i >= draft.assignments.length - 1 ? 'disabled' : ''}>↑</button>

              <button type="button" class="small ghost editA" data-i="${i}">Изменить</button>
              <button type="button" class="small ghost danger delA" data-i="${i}">Удалить</button>
            </div>
          </div>
          ${renderAssignmentBody(a)}
          ${getFiles(a).map(f => `<div class="filechip">📎 ${esc(f.name)}</div>`).join('')}

            <span class="tag">Правильный ответ</span>
            ${a.answerType === 'table' ? buildTableHtml(a.correctColumns || ['1'], a.correctRows || [['']]) : `<div>${esc(a.correctText) || '<em>не указан</em>'}</div>`}
          </div>
        </div>`;
      }).join('');
      try{ bindZoomControls(wrap); }catch(e){ console.error('bindZoomControls', e); }

      wrap.onclick = (e) => {
        const upBtn = e.target.closest('.moveUp');
        const downBtn = e.target.closest('.moveDown');
        if(upBtn){
          e.preventDefault();
          const i = +upBtn.dataset.i;
          // список показан в обратном порядке: ↑ = к концу массива
          if(i < draft.assignments.length - 1){
            const t = draft.assignments[i];
            draft.assignments[i] = draft.assignments[i + 1];
            draft.assignments[i + 1] = t;
            if(editingIndex === i) editingIndex = i + 1;
            else if(editingIndex === i + 1) editingIndex = i;
            paint();
          }
          return;
        }
        if(downBtn){
          e.preventDefault();
          const i = +downBtn.dataset.i;
          if(i > 0){
            const t = draft.assignments[i];
            draft.assignments[i] = draft.assignments[i - 1];
            draft.assignments[i - 1] = t;
            if(editingIndex === i) editingIndex = i - 1;
            else if(editingIndex === i - 1) editingIndex = i;
            paint();
          }
          return;
        }
        const editBtn = e.target.closest('.editA');
        const delBtn = e.target.closest('.delA');
        if(editBtn){
          e.preventDefault();
          const i = +editBtn.dataset.i;
          const a = draft.assignments[i];
          if(!a) return;
          editingIndex = i;
          if(a.answerType === 'table'){
            tableDraft = {
              columns: (a.correctColumns && a.correctColumns.length ? a.correctColumns : ['1']).slice(),
              rows: (a.correctRows && a.correctRows.length ? a.correctRows : [['']]).map(r => (r || []).slice())
            };
          } else {
            tableDraft = freshTableDraft();
          }
          pendingHtml = getAssignmentHtml(a);
          pendingFiles = getFiles(a).map(f => ({ dataUrl: f.dataUrl, name: f.name }));
          paint();
          try{
            if(a.answerType === 'table'){
              const rt = root.querySelector('input[name=answerType][value=table]');
              if(rt){ rt.checked = true; rt.dispatchEvent(new Event('change')); }
            } else {
              const rx = root.querySelector('input[name=answerType][value=text]');
              if(rx){ rx.checked = true; rx.dispatchEvent(new Event('change')); }
              const ct = document.getElementById('fCorrectText');
              if(ct) ct.value = a.correctText || '';

            renderPendingFiles();
            const formTitle = document.getElementById('formTitle');
            const btnAdd = document.getElementById('btnAddAssign');
            const btnCancel = document.getElementById('btnCancelEdit');
            if(formTitle) formTitle.textContent = 'Изменить задание №' + (i+1);
            if(btnAdd) btnAdd.textContent = 'Сохранить изменения';
            if(btnCancel) btnCancel.style.display = 'inline-block';
            const form = document.getElementById('assignForm');
            if(form) form.scrollIntoView({behavior:'smooth', block:'center'});
          }catch(err){ console.error('edit assignment UI', err); toast('Ошибка при открытии задания'); }
          return;
        }
        if(delBtn){
          e.preventDefault();
          const i = +delBtn.dataset.i;
          if(!confirm('Удалить это задание из набора?')) return;
          draft.assignments.splice(i, 1);
          paint();
        }
      };
    }

    paint();
  }

  // ================= STUDENT VIEW =================
  function studentSessionKey(setId){
    return 'tetrad:student-session:' + setId;
  }
  function loadStudentSession(setId){
    try{
      const raw = sessionStorage.getItem(studentSessionKey(setId));
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveStudentSession(setId, data){
    try{ sessionStorage.setItem(studentSessionKey(setId), JSON.stringify(data)); }
    catch(e){}
  }

  async function renderStudent(setId){
    root.innerHTML = `<div>Загрузка…</div>`;
    const meta = await loadSetMeta(setId);
    if(!meta){ root.innerHTML = `<div class="empty"><span class="doodle">упс…</span>Задание не найдено. Проверьте ссылку.</div>`; return; }
    const assignments = await loadAllAssignments(meta);

    let session = loadStudentSession(setId) || {};
    let student = {
      firstName: session.firstName || '',
      lastName: session.lastName || ''
    };

    const setTitle = (meta.topic && String(meta.topic).trim()) || 'Задания';
    const setFiles = (meta.files && meta.files.length) ? meta.files : [];
    try{ document.title = setTitle; }catch(e){}
    function renderSetFilesHtml(){
      if(!setFiles.length) return '';
      return `<div style="margin:12px 0;">` + setFiles.map(f =>
        (isSafeDataUrl(f.dataUrl)
          ? `<a class="filechip" href="${esc(f.dataUrl)}" download="${esc(f.name)}" target="_blank" rel="noopener noreferrer">📎 ${esc(f.name)}</a>`
          : `<span class="filechip">📎 ${esc(f.name)}</span>`)
      ).join('') + `</div>`;
    }

    function formatStudentAnswer(ans, a){
      if(!ans) return '—';
      if(ans.type === 'table'){
        const rows = ans.rows || [];
        const empty = !rows.length || rows.every(row => row.every(cell => !String(cell == null ? '' : cell).trim()));
        if(empty) return '—';
        const cols = ans.columns || (a && a.correctColumns) || [];
        const head = cols.map(c => esc(c)).join(' | ');
        const body = rows.map(r => r.map(c => esc(c)).join(' | ')).join('<br>');
        return `<div class="mini-table-text"><strong>${head}</strong><br>${body}</div>`;
      }
      const text = String(ans.text || '').trim();
      return text ? esc(text) : '—';
    }

    function paintDone(correctCount, total, resultRows){
      resultRows = resultRows || session.resultRows || [];
      root.innerHTML = `
        <div class="studentbox fade-in" style="max-width:560px;">
          <div class="checkbig">✓</div>
          <h2>Ответы отправлены</h2>
          <p class="meta" style="margin-bottom:8px;">${esc(setTitle)}</p>
          <p>Спасибо, ${esc(student.firstName)}! Учитель получит ваши ответы.</p>
          <div class="score-line" style="margin-top:18px; font-size:1.15rem;">Правильных ответов: <strong>${correctCount} из ${total}</strong></div>
          <button class="small" id="btnShowResults" style="margin-top:18px;">Показать результаты</button>
          <div id="studentResults" style="display:none; margin-top:16px; text-align:left;"></div>
        </div>`;

      const btn = document.getElementById('btnShowResults');
      const box = document.getElementById('studentResults');
      let open = false;
      btn.onclick = () => {
        open = !open;
        if(open){
          btn.textContent = 'Скрыть результаты';
          box.style.display = 'block';
          if(!resultRows.length){
            box.innerHTML = `<div class="meta">Нет данных о ответах.</div>`;
            return;
          }
          box.innerHTML = `
            <table class="result-table" style="width:100%;">
              <thead>
                <tr>
                  <th>№</th>
                  <th>Ваш ответ</th>
                </tr>
              </thead>
              <tbody>
                ${resultRows.map(row => `
                  <tr>
                    <td class="num">${row.num}</td>
                    <td class="${row.cls}">${row.display}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`;
        } else {
          btn.textContent = 'Показать результаты';
          box.style.display = 'none';
        }
      };
    }

    // Если уже отправлял — показываем экран успеха
    if(session.submitted){
      paintDone(session.correctCount || 0, session.total || assignments.length, session.resultRows);
      return;
    }

    function paintIntro(){
      root.innerHTML = `
        <div class="studentbox fade-in">
          <h2>${esc(setTitle)}</h2>
          <label class="field"><input placeholder="Фамилия" type="text" id="sLast" value="${esc(student.lastName)}"></label>
          <label class="field"><input placeholder="Имя" type="text" id="sFirst" value="${esc(student.firstName)}"></label>  
          <div class="warn" id="introWarn"></div>
          <button class="primary" id="btnStart">Начать</button>
        </div>
      `;
      document.getElementById('btnStart').onclick = () => {
        const f = clampStr(document.getElementById('sFirst').value.trim(), 80);
        const l = clampStr(document.getElementById('sLast').value.trim(), 80);
        if(!f || !l){ document.getElementById('introWarn').textContent = 'Заполните имя и фамилию.'; return; }
        if(/[<>]/.test(f + l)){ document.getElementById('introWarn').textContent = 'Недопустимые символы в имени.'; return; }
        student = { firstName:f, lastName:l };
        saveStudentSession(setId, { firstName:f, lastName:l, started:true, draftAnswers: session.draftAnswers || null });
        paintAssignments();
      };
    }

    function collectAnswersFromDom(wrap){
      return assignments.map(a => {
        const card = wrap.querySelector(`.card[data-aid="${a.id}"]`);
        if(a.answerType === 'table'){
          const rows = [...card.querySelectorAll('tbody tr')].map(tr => [...tr.querySelectorAll('input')].map(inp=>inp.value));
          return { assignmentId:a.id, type:'table', columns:a.correctColumns, rows };
        } else {
          return { assignmentId:a.id, type:'text', text: card.querySelector('.ansText').value };
        }
      });
    }

    function saveDraft(wrap){
      try{
        const draftAnswers = collectAnswersFromDom(wrap);
        saveStudentSession(setId, {
          firstName: student.firstName,
          lastName: student.lastName,
          started: true,
          draftAnswers
        });
      }catch(e){}
    }

    function paintAssignments(){
      const draftMap = {};
      (session.draftAnswers || []).forEach(a => { draftMap[a.assignmentId] = a; });

      root.innerHTML = `
        <h2>${esc(setTitle)}</h2>
        <div class="meta" style="margin-bottom:12px;">Ученик: ${esc(student.lastName)} ${esc(student.firstName)}</div>
        ${renderSetFilesHtml()}
        <div id="assignAnswers"></div>
        <button class="primary" id="btnSubmit" style="margin-top:10px;">Отправить ответы</button>
      `;
      const wrap = document.getElementById('assignAnswers');
      wrap.innerHTML = assignments.map((a,i) => {
        const draft = draftMap[a.id];
        let answerHtml;
        if(a.answerType === 'table'){
          const cols = (a.correctColumns && a.correctColumns.length) ? a.correctColumns : ['1'];
          let rows;
          if(draft && draft.type === 'table' && draft.rows && draft.rows.length){
            rows = draft.rows;
          } else if(a.correctRows && a.correctRows.length){
            rows = a.correctRows.map(row => (row || []).map(() => ''));
          } else {
            rows = [cols.map(() => '')];
          }
          // выровнять число столбцов
          rows = rows.map(r => {
            const rr = (r || []).slice();
            while(rr.length < cols.length) rr.push('');
            return rr.slice(0, cols.length);
          });
          answerHtml = `<div class="student-answer-wrap"><div class="meta" style="margin-bottom:6px;">Введите ответы в ячейки:</div>${buildTableHtml(cols, rows, { editableCells:true })}</div>`;
        } else {
          const text = (draft && draft.type === 'text') ? (draft.text || '') : '';
          answerHtml = `<textarea class="ansText" placeholder="Введите ответ">${esc(text)}</textarea>`;
        }
        return `
        <div class="card ${i%2 ? 'tilt-b':'tilt-a'}" data-aid="${esc(a.id)}">
          <div class="assign-head"><div class="numcircle">${i+1}</div><div class="grow"></div></div>
          ${renderAssignmentBody(a) || `<div class="content-text"><em>${esc(setTitle)}</em></div>`}
          ${getFiles(a).map(f => isSafeDataUrl(f.dataUrl)
            ? `<a class="filechip" href="${esc(f.dataUrl)}" download="${esc(f.name)}" rel="noopener noreferrer">📎 Скачать: ${esc(f.name)}</a>`
            : `<span class="filechip">📎 ${esc(f.name)}</span>`).join('')}
          <div style="margin-top:14px;">${answerHtml}</div>
        </div>`;
      }).join('');
      // таблицы в условии — только для просмотра
      wrap.querySelectorAll('.rich-content .ql-table-wrap, .rich-content table').forEach(el => {
        el.setAttribute('contenteditable', 'false');
        el.querySelectorAll('[contenteditable]').forEach(c => c.setAttribute('contenteditable', 'false'));
      });
      // явно включить ввод в таблице ответа
      wrap.querySelectorAll('.student-answer-wrap input.cellval').forEach(inp => {
        inp.removeAttribute('readonly');
        inp.removeAttribute('disabled');
        inp.tabIndex = 0;
      });
      bindZoomControls(wrap);

      // Автосохранение черновика при вводе
      wrap.addEventListener('input', () => saveDraft(wrap));

      document.getElementById('btnSubmit').onclick = async () => {
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true; btn.textContent = 'Отправка…';
        const answers = collectAnswersFromDom(wrap);

        // подсчёт правильных ответов + строки для таблицы результатов
        const norm = s => String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLowerCase();
        let correctCount = 0;
        const resultRows = [];
        assignments.forEach((a, idx) => {
          const ans = answers.find(x => x.assignmentId === a.id);
          let ok = false;
          let filled = false;
          if(ans && ans.type === 'table'){
            const rows = ans.rows || [];
            const empty = !rows.length || rows.every(row => row.every(cell => !String(cell == null ? '' : cell).trim()));
            if(!empty){
              filled = true;
              const cr = a.correctRows || [];
              if(rows.length === cr.length){
                ok = true;
                for(let ri = 0; ri < cr.length; ri++){
                  const sr = rows[ri] || [];
                  const crow = cr[ri] || [];
                  const n = Math.max(crow.length, (a.correctColumns || []).length);
                  for(let ci = 0; ci < n; ci++){
                    if(norm(sr[ci]) !== norm(crow[ci])){ ok = false; break; }
                  }
                  if(!ok) break;
                }
              }
            }
          } else if(ans && ans.type === 'text'){
            const text = String(ans.text || '').trim();
            if(text){
              filled = true;
              ok = norm(text) === norm(a.correctText || '');
            }
          }
          if(ok) correctCount++;
          resultRows.push({
            num: idx + 1,
            display: formatStudentAnswer(ans, a),
            cls: !filled ? 'ans-empty' : (ok ? 'ans-ok' : 'ans-bad')
          });
        });
        const total = assignments.length;

        const resp = { id:genId(), setId, firstName:student.firstName, lastName:student.lastName, submittedAt:Date.now(), answers };
        try{
          await sSet('response:'+setId+':'+resp.id, JSON.stringify(resp), true);
          saveStudentSession(setId, {
            firstName: student.firstName,
            lastName: student.lastName,
            submitted: true,
            correctCount,
            total,
            resultRows
          });
          paintDone(correctCount, total, resultRows);
        } catch(e){
          toast('Не удалось отправить, попробуйте ещё раз');
          btn.disabled = false; btn.textContent = 'Отправить ответы';
        }
      };
    }

    // Если ученик уже начинал — сразу к заданиям
    if(session.started && student.firstName && student.lastName){
      paintAssignments();
    } else {
      paintIntro();
    }
  }

  // ================= RESPONSES VIEW =================
  async function renderResponses(setId){
    root.innerHTML = `<div>Загрузка…</div>`;
    const meta = await loadSetMeta(setId);
    if(!meta){ root.innerHTML = `<div class="empty">Набор не найден.</div>`; return; }
    const assignments = await loadAllAssignments(meta);
    const keys = await sList('response:'+setId+':', true);
    const responses = (await Promise.all(keys.map(async k => {
      const v = await sGet(k, true);
      if(!v) return null;
      try{
        const obj = safeParseJson(v, null);
        if(!obj || typeof obj !== 'object') return null;
        obj._storageKey = k;
        obj.firstName = clampStr(obj.firstName, 80);
        obj.lastName = clampStr(obj.lastName, 80);
        return obj;
      }catch(e){ return null; }
    }))).filter(Boolean).sort((a,b)=>b.submittedAt-a.submittedAt);

    root.innerHTML = `
      <a class="backlink" id="back">← К списку наборов</a>
      <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px;">
        <h2 style="margin:0;">Ответы учеников</h2>
        ${responses.length ? `<button type="button" class="small danger" id="btnDelAllResp">Удалить все ответы</button>` : ''}
      </div>
      <div class="meta" style="margin-bottom:20px;">${esc(meta.topic||'')}</div>
      <div id="respWrap"></div>
    `;
    document.getElementById('back').onclick = () => location.hash = '';
    const btnDelAll = document.getElementById('btnDelAllResp');
    if(btnDelAll){
      btnDelAll.onclick = async () => {
        if(!confirm('Удалить ВСЕ ответы учеников по этому набору? Это нельзя отменить.')) return;
        btnDelAll.disabled = true;
        btnDelAll.textContent = 'Удаление…';
        try{
          await Promise.all(responses.map(r => r._storageKey ? sDelete(r._storageKey, true) : Promise.resolve()));
          toast('Все ответы удалены');
          renderResponses(setId);
        }catch(e){
          console.error(e);
          toast('Не удалось удалить все ответы');
          btnDelAll.disabled = false;
          btnDelAll.textContent = 'Удалить все ответы';
        }
      };
    }
    const wrap = document.getElementById('respWrap');
    if(!responses.length){
      wrap.innerHTML = `<div class="empty"><span class="doodle">тихо…</span>Пока никто не ответил.</div>`;
      return;
    }
    function norm(s){ return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLowerCase(); }
    function isTableEmpty(rows){
      if(!rows || !rows.length) return true;
      return rows.every(row => row.every(cell => !String(cell == null ? '' : cell).trim()));
    }
    function tablesEqual(studentRows, correctRows, correctCols){
      if(!correctRows || !correctRows.length) return false;
      if(!studentRows || studentRows.length !== correctRows.length) return false;
      for(let ri = 0; ri < correctRows.length; ri++){
        const sr = studentRows[ri] || [];
        const cr = correctRows[ri] || [];
        const n = Math.max(cr.length, (correctCols || []).length);
        for(let ci = 0; ci < n; ci++){
          if(norm(sr[ci]) !== norm(cr[ci])) return false;
        }
      }
      return true;
    }
    function formatTableCompact(columns, rows){
      if(!columns || !columns.length) return '—';
      const head = columns.map(c => esc(c)).join(' | ');
      const body = (rows || []).map(r => r.map(c => esc(c)).join(' | ')).join('<br>');
      return `<div class="mini-table-text"><strong>${head}</strong><br>${body || '—'}</div>`;
    }

    wrap.innerHTML = responses.map(r => {
      let correctCount = 0;
      // сохраняем порядок заданий из набора
      const rowsHtml = assignments.map((a, idx) => {
        const ans = (r.answers || []).find(x => x.assignmentId === a.id);
        let studentDisplay = '—';
        let correctDisplay = '—';
        let cls = 'ans-empty';
        let filled = false;

        if(a.answerType === 'table'){
          correctDisplay = a.correctColumns && a.correctColumns.length
            ? formatTableCompact(a.correctColumns, a.correctRows)
            : '—';
          if(ans && ans.type === 'table'){
            const empty = isTableEmpty(ans.rows);
            if(!empty){
              filled = true;
              studentDisplay = formatTableCompact(ans.columns || a.correctColumns, ans.rows);
              const ok = tablesEqual(ans.rows, a.correctRows, a.correctColumns);
              cls = ok ? 'ans-ok' : 'ans-bad';
              if(ok) correctCount++;
            }
          }
        } else {
          correctDisplay = a.correctText ? esc(a.correctText) : '—';
          const text = ans && ans.type === 'text' ? String(ans.text || '').trim() : '';
          if(text){
            filled = true;
            studentDisplay = esc(text);
            const ok = norm(text) === norm(a.correctText || '');
            cls = ok ? 'ans-ok' : 'ans-bad';
            if(ok) correctCount++;
          }
        }

        return `<tr>
          <td class="num">${idx + 1}</td>
          <td class="${cls}">${studentDisplay}</td>
          <td>${correctDisplay}</td>
        </tr>`;
      }).join('');

      const total = assignments.length;
      const done = assignments.reduce((acc, a) => {
        const ans = (r.answers || []).find(x => x.assignmentId === a.id);
        if(!ans) return acc;
        if(ans.type === 'table') return acc + (isTableEmpty(ans.rows) ? 0 : 1);
        return acc + (String(ans.text || '').trim() ? 1 : 0);
      }, 0);

      return `
      <div class="card" data-resp-key="${esc(r._storageKey || '')}">
        <div class="resp-summary">
          <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;flex-wrap:wrap;">
            <button type="button" class="resp-arrow" title="Подробнее" aria-label="Подробнее">▶</button>
            <h3 style="margin:0;">${esc(r.lastName)} ${esc(r.firstName)} | </h3>
            <span class="score-line" style="margin:0;"><strong>${correctCount} / ${total}</strong></span>
          </div>
          <button type="button" class="small danger btnDelResp" data-key="${esc(r._storageKey || '')}">Удалить</button>
        </div>
        <div class="resp-detail">
          <div class="meta" style="margin-bottom:10px;">отправлено ${fmtDate(r.submittedAt)}</div>
          <table class="result-table">
            <thead>
              <tr>
                <th>№</th>
                <th>Ответ ученика</th>
                <th>Правильный ответ</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
          <div class="score-line">Выполнено: ${done} из ${total} | Правильных ответов: ${correctCount} из ${total}</div>
        </div>
      </div>`;
    }).join('');

    wrap.querySelectorAll('.resp-summary').forEach(summary => {
      summary.onclick = (e) => {
        if(e.target.closest('.btnDelResp')) return;
        const card = summary.closest('.card');
        const detail = card.querySelector('.resp-detail');
        const arrow = card.querySelector('.resp-arrow');
        const open = detail.classList.toggle('open');
        if(open) arrow.classList.add('open');
        else arrow.classList.remove('open');
      };
    });

    wrap.querySelectorAll('.btnDelResp').forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        const key = btn.dataset.key;
        if(!key){ toast('Не удалось определить ответ'); return; }
        if(!confirm('Удалить ответ этого ученика?')) return;
        btn.disabled = true;
        btn.textContent = '…';
        try{
          await sDelete(key, true);
          toast('Ответ удалён');
          renderResponses(setId);
        }catch(err){
          console.error(err);
          toast('Не удалось удалить');
          btn.disabled = false;
          btn.textContent = 'Удалить';
        }
      };
    });
  }
})();
</script>
