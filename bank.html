<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк заданий</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .task-text p { margin: 0 0 8px; }
        .task-text p:last-child { margin-bottom: 0; }
        .task-text img { max-width: 100%; height: auto; border-radius: 6px; }
        .task-text ul, .task-text ol { margin: 8px 0; padding-left: 24px; }
        .task-text blockquote {
            border-left: 3px solid #d1d5db;
            margin: 8px 0;
            padding-left: 12px;
            color: #6b7280;
        }
        .task-text code {
            background: #f3f4f6;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .task-text pre {
            background: #1f2937;
            color: #e5e7eb;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        .task-text table {
            border-collapse: collapse;
            width: auto;
            max-width: 100%;
            margin: 8px 0;
            font-size: 14px;
            table-layout: auto;
            border: 1px solid #000;
        }
        .task-text td, .task-text th {
            border: 1px solid #000;
            padding: 4px 8px;
            min-width: 32px;
            min-height: 28px;
            width: auto;
            white-space: nowrap;
            vertical-align: middle;
            text-align: center;
            font-size: 14px;
            word-break: break-word;
        }
        .task-text th {
            background: #f3f4f6;
            font-weight: 600;
        }
        .task-text .ql-align-center { text-align: center; }
        .task-text .ql-align-right { text-align: right; }
        .task-text .ql-align-justify { text-align: justify; }
        .task-text .ql-align-left { text-align: left; }
        .task-text .table-left table { margin-left: 0; margin-right: auto; }
        .task-text .table-center table { margin-left: auto; margin-right: auto; }
        .task-text .table-right table { margin-left: auto; margin-right: 0; }
        .task-text .ql-table-wrap {
            margin: 10px 0;
            overflow-x: auto;
            display: table;
            max-width: 100%;
        }
        .task-text .ql-table-wrap[data-align="center"] { margin-left: auto; margin-right: auto; }
        .task-text .ql-table-wrap[data-align="right"] { margin-left: auto; margin-right: 0; }
        .task-text .ql-table-wrap[data-align="left"] { margin-left: 0; margin-right: auto; }
        .task-text .ql-table-del { display: none !important; }
        .add-link {
            display: inline-block;
            margin-left: 16px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }
        .add-link:hover { background: #1d4ed8; }
        .title-row {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title-row h1 { margin-bottom: 0; }

        .filters-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding: 14px 16px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }
        .type-edit-panel {
            margin-bottom: 24px;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }
        .type-edit-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .type-edit-fields label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .type-edit-fields input {
            padding: 9px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            min-width: 80px;
        }
        .type-edit-fields input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .type-edit-name {
            flex: 1;
            min-width: 200px;
        }
        .type-edit-name input {
            width: 100%;
        }
        .type-edit-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #9ca3af;
        }

        .filters-row {
            align-items: flex-end;
        }
        .filters-row .dropdown-box {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
        }
        .filters-row .dropdown-box label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin: 0;
        }

        .extra-filters {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: flex-end;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }
        .extra-filters .dropdown-box {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
        }
        .extra-filters .dropdown-box label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin: 0;
        }
        .extra-filters .dropdown-box select {
            min-width: 160px;
        }

        /* Поиск с кнопкой */
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 200px;
            max-width: 420px;
        }
        .search-box::before {
            content: "Поиск";
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .search-box .search-line {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .search-box input,
        .search-box .search-line input {
            flex: 1;
            width: auto;
        }
        .btn-search {
            padding: 10px 16px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-search:hover {
            background: #1d4ed8;
        }
    </style>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
    <main class="tasks-container">
        <div class="bank-toolbar" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px">
            <a href="index.html" class="home-logo" title="На главную"><img src="oge.jpg" alt="ЕГЭ/ОГЭ"></a>
            <a href="#" id="backSubject" class="btn-bank" style="background:#6b7280">← К разделу</a>
        </div>
        <div class="title-row">
            <h1 id="bankTitle">Банк заданий</h1>
            <a href="#" class="add-link" id="genLink" style="background:#059669">Сгенерировать вариант</a>
            <a href="add.html" class="add-link" id="addLink">+ Добавить задание</a>
        </div>

        <div class="filters-row">
            <div class="search-box">
                <div class="search-line">
                    <input type="text" id="searchInput" placeholder="Поиск по № задания (например 15)..." autocomplete="off">
                    <button type="button" class="btn-search" id="btnSearch">Найти</button>
                </div>
            </div>
            <div class="dropdown-box">
                <label for="taskNumberSelect">Задание:</label>
                <select id="taskNumberSelect">
                    <option value="all">Все</option>
                </select>
            </div>
        </div>
        <div class="type-edit-panel" id="typeEditPanel" hidden>
            <div class="type-edit-fields">
                <label>
                    <span>Номер</span>
                    <input type="number" id="editTypeNumber" min="1" placeholder="№">
                </label>
                <label class="type-edit-name">
                    <span>Название</span>
                    <input type="text" id="editTypeName" placeholder="Название задания">
                </label>
                <button type="button" class="btn-search" id="btnSaveType">Сохранить</button>
            </div>
            <p class="type-edit-hint">Изменение номера обновит все задания этого типа</p>
        </div>

        <div class="extra-filters" id="extraFilters">
            <div class="dropdown-box" id="subtypeFilterWrap" hidden>
                <label for="subtypeSelect">Подтип:</label>
                <select id="subtypeSelect">
                    <option value="all">Все</option>
                </select>
            </div>
            <div class="dropdown-box">
                <label for="sortSelect">Сортировка:</label>
                <select id="sortSelect">
                    <option value="desc" selected>По убыванию №</option>
                    <option value="asc">По возрастанию №</option>
                    <option value="random">Случайный порядок</option>
                </select>
            </div>
            <div class="dropdown-box">
                <label for="difficultySelect">Сложность:</label>
                <select id="difficultySelect">
                    <option value="all">Все</option>
                    <option value="basic">Базовый</option>
                    <option value="medium">Средний</option>
                    <option value="hard">Сложный</option>
                    <option value="coffin">Гроб</option>
                </select>
            </div>
        </div>

        <div id="tasksList" class="tasks-list"></div>
        <p id="noResults" class="no-results" hidden>Задания не найдены</p>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
    <script>
    (function(){
      var p = new URLSearchParams(location.search).get('exam');
      var exam = (p === 'oge' || p === 'ege') ? p : (sessionStorage.getItem('bank_exam') || 'ege');
      if (exam !== 'oge' && exam !== 'ege') exam = 'ege';
      try { sessionStorage.setItem('bank_exam', exam); } catch(e){}
      if (!p) {
        var u = new URL(location.href);
        u.searchParams.set('exam', exam);
        history.replaceState(null, '', u);
      }
      window.__BANK_EXAM__ = exam;
      document.addEventListener('DOMContentLoaded', function(){
        var titles = { oge: 'Банк заданий — Информатика ОГЭ', ege: 'Банк заданий — Информатика ЕГЭ' };
        var t = document.getElementById('bankTitle');
        if (t) t.textContent = titles[exam] || 'Банк заданий';
        document.title = titles[exam] || 'Банк заданий';
        var add = document.getElementById('addLink');
        if (add) add.href = 'add.html?exam=' + exam;
        var gen = document.getElementById('genLink');
        if (gen) gen.href = 'generate.html?exam=' + exam + '&mode=variant';
        var sub = document.getElementById('backSubject');
        if (sub) { sub.href = 'subject.html?exam=' + exam; sub.textContent = exam === 'oge' ? '← Информатика ОГЭ' : '← Информатика ЕГЭ'; }
      });
    })();
    </script>
    <script src="firebase-config.js"></script>
    <script src="firebase-db.js"></script>
    <script src="auth.js"></script>
<script src="script.js"></script>
<script>
(function(){
  var add = document.getElementById('addLink');
  if (add && (typeof BankAuth === 'undefined' || !BankAuth.isAdmin())) {
    add.style.display = 'none';
  }
})();
</script>
</body>
</html>
